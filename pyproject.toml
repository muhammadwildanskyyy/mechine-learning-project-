[project]
name = "ml-project"
version = "0.2.0"
description = "Unified Machine Learning project: Linear Regression, Mean Shift Clustering, and Deep Learning (DenseNet169 & EfficientNet-B1)."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "joblib>=1.4",
    "matplotlib>=3.9",
    "numpy>=1.26",
    "pandas>=2.2",
    "pillow>=10.0",
    "scikit-learn>=1.5",
    "seaborn>=0.13",
    "torch>=2.4",
    "torchvision>=0.19",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
ml-project = "ml_project.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_project"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]
